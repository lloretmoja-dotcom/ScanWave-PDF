plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.scanwavepdf.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.scanwavepdf.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            // Misma idea que en los demás proyectos: con esta firma fija
            // guardada en el propio proyecto, todas las compilaciones
            // futuras firman igual, y las actualizaciones se instalan
            // de verdad encima de la versión anterior. Esta firma es
            // SOLO para probar la app fuera de Play Store (no sirve
            // para subir a Play Store).
            storeFile file("ci-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Firma real para subir a Play Store. Los datos salen de
            // variables de entorno que pone el flujo de GitHub Actions,
            // leidas de los "Secrets" del repositorio (nunca quedan
            // escritas aqui ni en el repositorio publico).
            def ksFile = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (System.getenv("RELEASE_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Escaner de documentos de Google (recorte automatico, varias
    // paginas, y entrega directa en PDF) - es de Google mismo, no
    // tiene ningun riesgo de politicas de Google Play.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // Reconocimiento de texto (OCR) dentro de cada pagina, para poder
    // buscar un documento por una palabra que contenga. Tambien de
    // Google, funciona entero dentro del movil.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Anuncios (AdMob), igual que en Boughazi-TV.
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
