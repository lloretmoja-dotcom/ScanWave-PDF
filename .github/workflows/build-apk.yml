name: Compilar APK de ScanWave PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TIENE_FIRMA_REAL: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Indicar a Gradle dónde está el SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Compilar el APK (debug, listo para instalar directamente)
        run: gradle assembleDebug --stacktrace

      - name: Subir el APK como resultado descargable (copia de seguridad)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en un enlace permanente (Releases)
        uses: ncipollo/release-action@v1
        with:
          tag: ultima-version
          name: "ScanWave PDF — última versión"
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar la firma real para Play Store (si ya está configurada)
        if: ${{ env.TIENE_FIRMA_REAL == 'true' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release-upload-key.jks

      - name: Compilar el archivo .aab para subir a Play Store
        if: ${{ env.TIENE_FIRMA_REAL == 'true' }}
        env:
          RELEASE_KEYSTORE_PATH: release-upload-key.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Subir el .aab como resultado descargable (para Play Store)
        if: ${{ env.TIENE_FIRMA_REAL == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
